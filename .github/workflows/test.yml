name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,plots]"
          pip install pytest ruff mypy

      - name: Ruff
        run: ruff check src tests

      - name: Mypy strict
        run: mypy --strict src

      - name: Pytest
        run: pytest -q

  build:
    name: "Build sdist + wheel"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Verify templates land in sdist
        run: |
          tar -tzf dist/*.tar.gz | grep "templates/ai_act/" || (echo "templates missing from sdist" && exit 1)
      - name: Verify templates land in wheel
        run: |
          unzip -l dist/*.whl | grep "templates/ai_act/" || (echo "templates missing from wheel" && exit 1)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
